apiVersion: apps/v1
kind: Deployment
metadata:
  name: vram
  labels:
    app: vram
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vram
  template:
    metadata:
      labels:
        app: vram
    spec:
      containers:
        - name: vram
          image: quay.io/6lackrose/vram:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: VRAM_LOG_LEVEL
              value: INFO
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
